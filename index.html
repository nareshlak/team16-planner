<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team 16 Planner — ROP Eye Speculum</title><style id="app-css">:root{
  --bg:#f5f4ef; --panel:#ffffff; --panel2:#faf9f6; --ink:#1b2124; --ink2:#3a4347; --muted:#6b7377; --faint:#9aa1a4;
  --line:#e4e2db; --line2:#eeece6; --accent:#0e6b6b; --accent-soft:#e3f1ef; --danger:#b42318; --danger-soft:#fdecea;
  --warn:#b45309; --ok:#15803d; --ok-soft:#e7f5ec;
  --p1:#b42318; --p2:#c76a0a; --p3:#2f5fbf; --p4:#7a8287;
  --k-client:#0e6b6b; --k-course:#4b5563; --k-team:#4f46e5; --k-break:#9ca3af;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,30,.06),0 4px 14px rgba(20,30,30,.05);
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:18px 22px 60px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* header */
.top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{margin:2px 0 0;font-size:24px;letter-spacing:-.01em;font-weight:700}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.save{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.save.ok .dot{background:var(--ok)} .save.pending .dot{background:var(--warn);animation:pulse 1s infinite} .save.off .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.save button{border:0;background:none;color:var(--accent);font-weight:600;padding:0 0 0 4px;font-size:12.5px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:#cfccc2;background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b5959}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=date],textarea{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:6px 8px;font-size:13px}
textarea{resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}

/* phase hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero .card{padding:14px 16px}
.phase-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phase-row select{font-weight:600;font-size:15px;padding:5px 8px;max-width:100%}
.phase-dates{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.phase-goal{margin:10px 0 12px;font-size:14.5px;color:var(--ink2);max-width:80ch}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;background:var(--line2);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.tent{background:#fff4e0;color:#94580a}
.stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.bad b{color:var(--danger)}
.progress{flex:1;min-width:160px}
.bar-track{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
.next h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.next-list{display:flex;flex-direction:column;gap:6px}
.next-item{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}
.next-item:hover{border-color:var(--line)}
.next-item .d{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.next-item .r{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.next-item .r.soon{color:var(--danger);font-weight:600}
.kdot{display:inline-block;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);margin-right:7px;vertical-align:1px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .sp{flex:1}
.toolbar label.lbl{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* gantt */
.gantt{overflow:auto;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-height:calc(100vh - 120px)}
.g-inner{position:relative}
.g-head{position:sticky;top:0;z-index:6;background:var(--panel);display:flex;border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:7;background:var(--panel);border-right:1px solid var(--line);flex:none;display:flex;align-items:flex-end;padding:6px 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.g-scale{position:relative;flex:none}
.g-weeks,.g-days{position:relative;height:24px}
.g-weeks>div{position:absolute;top:0;height:24px;border-left:1px solid var(--line);padding:4px 6px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden}
.g-weeks>div span{font-weight:400;color:var(--muted);margin-left:6px;font-family:var(--mono);font-size:11px}
.g-days>div{position:absolute;top:0;height:24px;text-align:center;font-size:10.5px;line-height:1.05;color:var(--muted);font-family:var(--mono);padding-top:2px;border-left:1px solid var(--line2)}
.g-days>div.we{color:var(--faint)}
.g-days>div.today{color:#fff;background:var(--danger);border-radius:4px}
.g-bg{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
.g-bg .col{position:absolute;top:0;bottom:0}
.g-bg .col.we{background:rgba(120,120,100,.045)}
.g-bg .col.brk{background:repeating-linear-gradient(135deg,rgba(150,150,140,.13) 0 6px,rgba(150,150,140,.04) 6px 12px)}
.g-bg .vline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed}
.g-bg .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.75}
.g-row{display:flex;position:relative;z-index:1;border-bottom:1px solid var(--line2)}
.g-label{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line);flex:none;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.g-label .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.g-label .sub{font-size:11.5px;color:var(--muted)}
.g-label .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.g-track{position:relative;flex:none}
.g-key .g-label{background:var(--panel2)}
.g-key{background:var(--panel2)}
.ms{position:absolute;display:flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap;cursor:pointer;height:20px;padding-right:4px}
.ms .dm{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;flex:none}
.ms.range .rg{position:absolute;left:0;height:6px;top:7px;border-radius:3px;opacity:.28}
.ms .tx{position:relative;color:var(--ink2);font-weight:500;background:rgba(250,249,246,.85);padding:0 2px;border-radius:3px}
.ms.tent .tx{font-style:italic;color:var(--muted)}
.ms:hover .tx{text-decoration:underline}
.bar{position:absolute;height:24px;border-radius:6px;display:flex;align-items:center;cursor:grab;user-select:none;touch-action:none;font-size:12px;font-weight:500}
.bar .fill{position:absolute;inset:0;border-radius:6px}
.bar .lab{position:relative;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;pointer-events:none;display:flex;gap:5px;align-items:center;width:100%}
.bar.out .lab{position:absolute;left:100%;width:auto;color:var(--ink2);padding-left:6px;overflow:visible}
.bar .pb{font-family:var(--mono);font-size:10px;font-weight:600;background:rgba(255,255,255,.25);border-radius:3px;padding:0 3px}
.bar.out .pb{background:var(--line2);color:var(--muted)}
.bar.done .fill{opacity:.28}
.bar.done .lab{color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.45)}
.bar.late{box-shadow:0 0 0 2px var(--danger)}
.bar.doing .fill{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.bar .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;border-radius:0 6px 6px 0}
.bar .rz:hover{background:rgba(0,0,0,.18)}
.bar.dragging{cursor:grabbing;opacity:.85;z-index:5}
.bar .clipL,.bar .clipR{position:absolute;top:6px;font-size:10px;color:#fff;pointer-events:none}
.bar .clipL{left:2px}.bar .clipR{right:9px}
.bar .co{font-size:10px;opacity:.85}
.g-empty{padding:10px 12px;color:var(--faint);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col-m{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:120px}
.col-h{padding:10px 12px 8px;border-bottom:1px solid var(--line);position:relative}
.col-h .top-strip{position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.col-h .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.col-h .rl{font-size:12px;color:var(--muted)}
.col-h .mini{margin-top:7px;height:5px;background:var(--line2);border-radius:9px;overflow:hidden}
.col-h .mini i{display:block;height:100%}
.col-b{padding:8px;display:flex;flex-direction:column;gap:7px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 9px 8px 8px;display:grid;grid-template-columns:20px 1fr;gap:6px;cursor:pointer;position:relative}
.tcard:hover{border-color:#cfccc2;box-shadow:var(--shadow)}
.tcard .tt{font-size:13px;font-weight:500;line-height:1.3}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.tcard.done{opacity:.7}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:11.5px;color:var(--muted)}
.tcard .wait{font-size:11.5px;color:var(--muted);margin-top:4px}
.tcard .wait.warn{color:var(--warn)}
.box{width:17px;height:17px;border:1.5px solid #b8b5ab;border-radius:5px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;margin-top:1px}
.box.on{background:var(--accent);border-color:var(--accent)}
.box.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pchip{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;color:#fff}
.due{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.due.late{background:var(--danger-soft);color:var(--danger);font-weight:600}
.due.soon{background:#fff4e0;color:#94580a}
.pill{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.av{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;border:2px solid #fff;margin-left:-5px}
.avs{display:inline-flex;padding-left:5px}
.addc{border:1px dashed #cfccc2;background:none;border-radius:8px;padding:6px;color:var(--muted);font-size:12.5px}
.addc:hover{color:var(--accent);border-color:var(--accent)}
.empty{font-size:12px;color:var(--faint);padding:6px 4px}

/* priorities */
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:22px 34px 22px minmax(220px,1fr) 120px 110px 132px 118px 54px;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line2);background:var(--panel)}
.prow.head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel2);font-weight:600}
.prow.done .ttl{text-decoration:line-through;color:var(--muted)}
.prow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.prow.dragging{opacity:.4}
.prow .grip{cursor:grab;color:var(--faint);font-size:14px;text-align:center;user-select:none}
.prow .rk{font-family:var(--mono);font-weight:600;color:var(--ink2);font-size:13px}
.prow .ttl{font-weight:500;cursor:pointer}
.prow .ttl:hover{color:var(--accent)}
.prow .cat{font-size:11.5px;color:var(--muted)}
.prow select{padding:3px 5px;font-size:12px;width:100%}
.prow .ud{display:flex;gap:2px}
.prow .ud button{border:1px solid var(--line);background:var(--panel);border-radius:5px;width:24px;height:22px;font-size:11px;color:var(--muted);padding:0}
.pstripe{border-left:3px solid transparent}
.pgroup{padding:6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);border-bottom:1px solid var(--line2)}

/* calendar */
.cal{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;table-layout:fixed}
.cal th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600}
.cal td{vertical-align:top;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:5px 6px 7px;height:74px;position:relative}
.cal td:last-child{border-right:0}
.cal td.wk{background:var(--panel2);font-family:var(--mono);font-size:12px;color:var(--ink2);font-weight:600;text-align:center}
.cal td.wk small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px}
.cal tr.brk td:not(.wk){background:repeating-linear-gradient(135deg,rgba(150,150,140,.09) 0 6px,transparent 6px 12px)}
.cal tr.inphase td.wk{box-shadow:inset 3px 0 0 var(--accent)}
.cal td.today{background:#fff8f6;box-shadow:inset 0 0 0 2px var(--danger)}
.cal td.past{background:#fbfbf9}
.cal .dn{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cal .dn b{color:var(--ink);font-weight:600}
.cal .add{opacity:0;border:0;background:none;color:var(--accent);font-size:15px;line-height:1;padding:0 2px}
.cal td:hover .add{opacity:1}
.ev{display:block;font-size:11.5px;line-height:1.25;padding:2px 5px;border-radius:4px;margin-top:3px;cursor:pointer;border-left:3px solid;background:var(--panel2);color:var(--ink2)}
.ev.major{font-weight:600}
.ev.tent{font-style:italic}
.ev.cont{opacity:.6;font-size:10.5px}
.ev.task{border-left-width:0;background:none;padding:1px 0;display:flex;gap:5px;align-items:baseline}
.ev.task i{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.ev.task.done{text-decoration:line-through;color:var(--faint)}
.gchip{display:block;font-size:11.5px;padding:3px 7px;border-radius:5px;margin-bottom:4px;cursor:pointer;line-height:1.25;border:1px solid}
.gchip.cont{opacity:.55}
.gchip.phase{background:var(--ink);color:#fff;border-color:var(--ink)}
.gchip.phase.cont{background:none;color:var(--ink2)}
.cal-wrap{overflow-x:auto}

/* roadmap */
.road{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.road-inner{position:relative}
.r-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 12px 4px;position:sticky;left:0}
.r-row{position:relative;height:30px}
.r-bar{position:absolute;top:4px;height:22px;border-radius:6px;font-size:12px;font-weight:500;color:#fff;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.r-bar.out{overflow:visible}
.r-bar.phase{background:var(--ink)}
.r-bar.phase.tent{background:#5b6468}
.r-bar.cur{box-shadow:0 0 0 2px var(--accent),0 0 0 4px #fff}
.r-bar.done{opacity:.45}
.r-months{position:relative;height:26px;border-bottom:1px solid var(--line);background:var(--panel2)}
.r-months div{position:absolute;top:0;height:26px;border-left:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2);padding:5px 6px}
.r-bg{position:absolute;top:26px;bottom:0;pointer-events:none}
.r-bg .brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(150,150,140,.13) 0 6px,rgba(150,150,140,.04) 6px 12px)}
.r-bg .tl{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.7}
.r-ms{position:absolute;top:8px;width:9px;height:9px;transform:rotate(45deg);border-radius:2px;cursor:pointer}
.gtable{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.grow{display:grid;grid-template-columns:minmax(240px,1fr) 170px 150px 130px 80px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
.grow.head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel2);font-weight:600}
.grow .gt{font-weight:500;cursor:pointer}
.grow .gt:hover{color:var(--accent)}
.grow select{font-size:12px;padding:3px 5px}
.term-h{padding:7px 12px;background:var(--panel2);font-weight:700;font-size:12px;letter-spacing:.04em;border-bottom:1px solid var(--line2)}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.set-grid .card{padding:14px 16px}
.set-grid h3{margin:0 0 4px;font-size:15px}
.set-grid p.d{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.mrow{display:grid;grid-template-columns:30px 1fr 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
.mrow input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff}
.phrow{display:grid;grid-template-columns:1fr 130px 130px auto;gap:6px;align-items:center;margin-bottom:6px}
.phrow .cur{font-size:10.5px;color:var(--accent);font-weight:700}
.x{border:0;background:none;color:var(--faint);font-size:16px;padding:0 4px}
.x:hover{color:var(--danger)}

/* modal */
.mback{position:fixed;inset:0;background:rgba(20,26,28,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(620px,100%);padding:18px 20px}
.modal h2{margin:0 0 14px;font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f>span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input[type=text],.f textarea,.f select,.f input[type=date]{width:100%}
.owners{display:flex;flex-wrap:wrap;gap:6px}
.ochip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 10px 3px 4px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.ochip i{width:16px;height:16px;border-radius:50%;display:inline-block;opacity:.35}
.ochip.on{border-color:currentColor;font-weight:600}
.ochip.on i{opacity:1}
.mfoot{display:flex;gap:8px;margin-top:18px;align-items:center}
.mfoot .sp{flex:1}
.warnline{font-size:12px;color:var(--warn);margin-top:4px}
.banner{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;background:#fff4e0;color:#7a4a08;border:1px solid #f1d9a8}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .wrap{padding:12px 12px 50px}
  .prow{grid-template-columns:22px 30px 22px minmax(180px,1fr) 110px 100px 120px 110px 54px}
  .plist{overflow-x:auto}
  .set-grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
}
.pres{display:inline-flex;align-items:center;padding-left:6px}
.pres .lbl{font-size:12px;color:var(--muted);margin-right:8px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;font-style:normal;border:2px solid var(--bg);flex:none}
.pres .av{margin-left:-6px}
.act{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.act:first-of-type{border-top:0}
.act ul{margin:4px 0 0;padding-left:18px;color:var(--ink2)}
.here{display:flex;flex-wrap:wrap;gap:12px}
.here span{display:inline-flex;align-items:center;gap:6px}
.edited{margin:-6px 0 12px;font-size:12.5px;color:var(--muted)}
@media print{.tabs,.toolbar,.save,.btn{display:none!important}.gantt{max-height:none}}

}

/* ---------- SEMESTER CALENDAR ---------- */

/* ---------- GOALS ROADMAP ---------- */
function viewGoals(v) {
  var s0 = toN(S.semesters[0].start), e0 = toN(S.semesters[S.semesters.length - 1].end) + 2;
  var LW = 0, nd = e0 - s0 + 1;
  var avail = Math.max(900, (v.clientWidth || 1100) - 2);
  var dw = Math.max(3.2, avail / nd), W = Math.round(nd * dw);

  var bg = S.milestones.filter(function (m) { return m.kind === 'break' && m.end && !/finals/i.test(m.title); }).map(function (m) { return '<div class="brk" style="left:' + X(m.date) + 'px;width:' + (X(m.end) - X(m.date) + dw) + 'px" title="' + esc(m.title) + '"></div>'; }).join('');
  if (TN >= s0 && TN <= e0) bg += '<div class="tl" style="left:' + X(TODAY) + 'px"></div>';
  function pack(items, cls, colorOf, extra) {
    var rows = [], html = '';
    items.slice().sort(function (a, b) { return toN(a.start) - toN(b.start); }).forEach(function (it) {
      var l = X(it.start), w = Math.max(dw * 2, X(it.end) - l + dw);

/* ---------- MODALS ---------- */
var mroot = document.createElement('div'); document.body.appendChild(mroot);
function closeModal() { mroot.innerHTML = ''; modalOpen = false; if (dirty && !timer) timer = setTimeout(flush, 600); }
function showModal(html, onSave, onDelete) {
  modalOpen = true;
  mroot.innerHTML = '<div class="mback" data-mback="1"><div class="modal" role="dialog" aria-modal="true">' + html +
    '<div class="mfoot">' + (onDelete ? '<button class="btn danger" data-m="del">Delete</button>' : '') + '<span class="sp"></span><button class="btn" data-m="cancel">Cancel</button><button class="btn primary" data-m="save">Save</button></div></div></div>';
  var root = mroot.querySelector('.modal');
  var first = root.querySelector('input[type=text],textarea'); if (first) setTimeout(function () { first.focus(); }, 30);
  mroot.onclick = function (e) {
    if (e.target.getAttribute('data-mback')) return closeModal();
    var oc = e.target.closest('.ochip'); if (oc) { oc.classList.toggle('on'); return; }
    var b = e.target.closest('[data-m]'); if (!b) return;
    var m = b.getAttribute('data-m');
    if (m === 'cancel') closeModal();
    if (m === 'save') { if (onSave(root) !== false) { closeModal(); markDirty(); render(); } }
    if (m === 'del') { if (b.getAttribute('data-sure')) { onDelete(); closeModal(); markDirty(); render(); } else { b.setAttribute('data-sure', '1'); b.textContent = 'Click again to delete'; } }
  };
  root.onkeydown = function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) root.querySelector('[data-m=save]').click(); };
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modalOpen) closeModal(); });
function val(root, name) { var el = root.querySelector('[name=' + name + ']'); return el ? el.value.trim() : ''; }
function ownerPicker(sel) {
  return '<div class="owners">' + S.members.map(function (m) { return '<button type="button" class="ochip' + (sel.indexOf(m.id) >= 0 ? ' on' : '') + '" data-oid="' + m.id + '" style="color:' + m.color + '"><i style="background:' + m.color + '"></i><span style="color:var(--ink)">' + esc(m.short || m.name) + '</span></button>'; }).join('') + '</div>';
}
function pickedOwners(root) { return Array.prototype.map.call(root.querySelectorAll('.ochip.on'), function (b) { return b.getAttribute('data-oid'); }); }
function phaseOptions(sel) { return S.phases.slice().sort(function (a, b) { return toN(a.start) - toN(b.start); }).map(function (p) { return '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join(''); }

function openTask(id, preset) {
  var isNew = !id;
  var t = isNew ? { id: '', title: '', owners: [], phase: UI.phaseId, start: '', due: '', priority: 2, status: 'todo', category: '', notes: '', dependsOn: '' } : task(id);
  if (!t) return;
  if (isNew) {
    var p = curPhase(), st = TN >= toN(p.start) && TN <= toN(p.end) ? TODAY : p.start;
    t.start = st; t.due = toISO(Math.min(toN(st) + 2, toN(p.end)));
    if (preset && preset.lane !== undefined && preset.lane !== '') {
      if (member(preset.lane)) t.owners = [preset.lane];

    }
  }
  var deps = S.tasks.filter(function (x) { return x.id !== t.id; }).sort(function (a, b) { return toN(a.due) - toN(b.due); });
  var html = '<h2>' + (isNew ? 'New task' : 'Edit task') + '</h2>' + (isNew ? '' : editedNote(t)) + '<div class="fgrid">' +
    '<label class="f full"><span>Task</span><input type="text" name="title" value="' + esc(t.title) + '" placeholder="What needs to happen?"></label>' +
    '<div class="f full"><span>Owners</span>' + ownerPicker(t.owners || []) + '</div>' +
    '<label class="f"><span>Start</span><input type="date" name="start" value="' + esc(t.start) + '"></label>' +

    '<label class="f"><span>Priority</span><select name="priority">' + [1, 2, 3, 4].map(function (p) { return '<option value="' + p + '"' + (+t.priority === p ? ' selected' : '') + '>' + PRI[p] + '</option>'; }).join('') + '</select></label>' +
    '<label class="f"><span>Status</span><select name="status">' + Object.keys(STATUS).map(function (s) { return '<option value="' + s + '"' + (t.status === s ? ' selected' : '') + '>' + STATUS[s] + '</option>'; }).join('') + '</select></label>' +
    '<label class="f"><span>Phase</span><select name="phase">' + phaseOptions(t.phase) + '</select></label>' +
    '<label class="f"><span>Workstream</span><select name="category"><option value="">—</option>' + S.categories.map(function (c) { return '<option' + (t.category === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
    '<label class="f full"><span>Waits on (hand-off)</span><select name="dependsOn"><option value="">— none —</option>' + deps.map(function (d) { return '<option value="' + d.id + '"' + (t.dependsOn === d.id ? ' selected' : '') + '>' + esc(md(d.due) + ' · ' + d.title) + '</option>'; }).join('') + '</select></label>' +
    '<label class="f full"><span>Notes</span><textarea name="notes" rows="3">' + esc(t.notes) + '</textarea></label></div>' +
    (isNew ? '' : '<div style="margin-top:10px"><button class="btn sm" data-dup="1">Duplicate</button></div>');
  showModal(html, function (root) {
    var title = val(root, 'title'); if (!title) { root.querySelector('[name=title]').focus(); return false; }
    var st = val(root, 'start'), du = val(root, 'due');
    if (!st && du) st = du; if (!du && st) du = st; if (!st) { st = du = TODAY; }
    if (toN(du) < toN(st)) { var tmp = st; st = du; du = tmp; }
    var obj = isNew ? { id: uid('t'), rank: S.tasks.length + 1 } : t;
    obj.title = title; obj.owners = pickedOwners(root); obj.start = st; obj.due = du; obj.priority = +val(root, 'priority');
    obj.status = val(root, 'status'); obj.phase = val(root, 'phase'); obj.category = val(root, 'category'); obj.dependsOn = val(root, 'dependsOn'); obj.notes = val(root, 'notes');
    if (isNew) { var maxR = 0; S.tasks.forEach(function (x) { if (x.rank > maxR) maxR = x.rank; }); obj.rank = maxR + 1; S.tasks.push(obj); }
  }, isNew ? null : function () { S.tasks = S.tasks.filter(function (x) { return x.id !== t.id; }); S.tasks.forEach(function (x) { if (x.dependsOn === t.id) x.dependsOn = ''; }); });
  var dup = mroot.querySelector('[data-dup]');
  if (dup) dup.onclick = function (e) { e.stopPropagation(); var c = JSON.parse(JSON.stringify(t)); c.id = uid('t'); c.title = t.title + ' (copy)'; c.status = 'todo'; c.rank = t.rank + 0.5; S.tasks.push(c); S.tasks.sort(byRank).forEach(function (x, i) { x.rank = i + 1; }); closeModal(); markDirty(); render(); openTask(c.id); };
}

function openPhase(id) {

function newPhase() {
  var cur = curPhase();
  var s = toISO(toN(cur.end) + 1 + ((8 - dow(toN(cur.end) + 1)) % 7));
  var e = toISO(toN(s) + 18);
  var html = '<h2>Start the next phase</h2><div class="fgrid">' +
    '<label class="f full"><span>Name</span><input type="text" name="name" placeholder="e.g. Spring Planning"></label>' +
    '<label class="f"><span>Start</span><input type="date" name="start" value="' + s + '"></label>' +

    '<div class="f full"><span>Carry over</span><label class="chk"><input type="checkbox" name="carry" checked> Move unfinished tasks from</label><select name="from">' + phaseOptions(cur.id) + '</select></div>' +
    '<div class="f full"><span>Reuse as template</span><label class="chk"><input type="checkbox" name="tpl"> Copy every task from</label><select name="tplFrom">' + phaseOptions(cur.id) + '</select><span class="muted" style="font-size:12px;text-transform:none;letter-spacing:0;font-weight:400">Copies are reset to To do, with dates shifted by the gap between the two phase start dates.</span></div>' +
    '<div class="f"><span>Make current</span><label class="chk"><input type="checkbox" name="cur" checked> Open the planner to this phase</label></div></div>';
  showModal(html, function (root) {
    var n = val(root, 'name'), st = val(root, 'start'), en = val(root, 'end'); if (!n || !st || !en) { root.querySelector('[name=name]').focus(); return false; }
    var p = { id: uid('ph-'), name: n, start: st, end: toN(en) < toN(st) ? st : en, goal: val(root, 'goal'), term: toN(st) >= toN('2027-01-01') ? 'spring' : 'fall' };
    S.phases.push(p);
    var moved = 0, copied = 0, maxR = 0; S.tasks.forEach(function (x) { if (x.rank > maxR) maxR = x.rank; });
    if (root.querySelector('[name=tpl]').checked) {
      var src = phase(val(root, 'tplFrom')), shift = toN(st) - toN(src.start);
      S.tasks.filter(function (t) { return t.phase === src.id; }).sort(byRank).forEach(function (t) {
        var c = JSON.parse(JSON.stringify(t)); c.id = uid('t'); c.phase = p.id; c.status = 'todo'; c.dependsOn = ''; c.rank = ++maxR;

    }

      var from = val(root, 'from');

    }
    if (root.querySelector('[name=cur]').checked) S.currentPhase = p.id;
    UI.phaseId = p.id; UI.view = 'timeline';
    toast('Phase created' + (moved ? ' · ' + moved + ' tasks carried over' : '') + (copied ? ' · ' + copied + ' template tasks' : ''));
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  if (e.target.closest('.mback')) return;
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (act !== 'goto' && act !== 'set' && act !== 'toggle' && act !== 'pick-phase' && act !== 'export' && act !== 'show-export' && locked() && /^(new|check|mv|autorank|del|add|import|make)/.test(act)) { toast('View only'); return; }
  switch (act) {
    case 'goto': e.preventDefault(); UI.view = el.getAttribute('data-v'); try { history.replaceState(null, '', '#' + UI.view); } catch (er) { location.hash = UI.view; } render(); break;
    case 'set': UI[el.getAttribute('data-k')] = el.getAttribute('data-v'); render(); break;
    case 'toggle': UI[el.getAttribute('data-k')] = !UI[el.getAttribute('data-k')]; render(); break;
    case 'save-now': if (timer) clearTimeout(timer); flush(); break;
    case 'new-task': e.stopPropagation(); openTask(null, { lane: el.getAttribute('data-lane') }); break;
    case 'edit-task': openTask(id); break;
    case 'check': e.stopPropagation(); var t = task(id); t.status = t.status === 'done' ? 'todo' : 'done'; markDirty(); render(); break;
    case 'new-ms': openMs(null, el.getAttribute('data-date')); break;
    case 'edit-ms': openMs(id); break;
    case 'new-goal': openGoal(null); break;
    case 'edit-goal': openGoal(id); break;
    case 'edit-phase': openPhase(id); break;
    case 'new-phase': newPhase(); break;
    case 'pick-phase': e.preventDefault(); UI.phaseId = id; UI.view = 'timeline'; try { history.replaceState(null, '', '#timeline'); } catch (er) {} render(); window.scrollTo(0, 0); break;
    case 'make-current': S.currentPhase = id; markDirty(); render(); break;
    case 'mv': var list = scopedTasks().slice().sort(byRank); if (UI.prHideDone) list = list.filter(function (x) { return x.status !== 'done'; }); if (UI.prMember !== 'all') list = list.filter(function (x) { return x.owners.indexOf(UI.prMember) >= 0; });
      var i = list.indexOf(task(id)), d = +el.getAttribute('data-d'), j = i + d; if (j < 0 || j >= list.length) break;
      moveRank(id, list[j].id, d > 0); break;
    case 'autorank': S.tasks.slice().sort(function (a, b) { return (a.status === 'done') - (b.status === 'done') || a.priority - b.priority || toN(a.due) - toN(b.due); }).forEach(function (t, k) { t.rank = k + 1; }); markDirty(); render(); toast('Re-ranked by priority, then deadline'); break;
    case 'add-member': var nm = { id: uid('m-'), name: 'New member', short: 'New', role: 'Role', color: '#64748b' }; S.members.push(nm); markDirty(); render(); break;
    case 'del-member': if (el.getAttribute('data-sure')) { S.members = S.members.filter(function (m) { return m.id !== id; }); S.tasks.forEach(function (t) { t.owners = (t.owners || []).filter(function (o) { return o !== id; }); }); S.goals.forEach(function (g) { g.owners = (g.owners || []).filter(function (o) { return o !== id; }); }); markDirty(); render(); } else { el.setAttribute('data-sure', '1'); el.textContent = 'Sure?'; el.style.fontSize = '11px'; } break;
    case 'export': var js = JSON.stringify(S, null, 1); var io = document.getElementById('io'); if (io) io.value = js;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(js).then(function () { toast('Backup copied to clipboard'); }, function () { toast('Copy blocked — backup shown in the box; select it and copy'); }); else toast('Backup shown in the box'); break;
    case 'show-export': document.getElementById('io').value = JSON.stringify(S, null, 1); break;
    case 'import':
      try { var data = JSON.parse(document.getElementById('io').value); if (!data.tasks || !data.members || !data.phases) throw 0; if (!el.getAttribute('data-sure')) { el.setAttribute('data-sure', '1'); el.textContent = 'Click again — this replaces everything'; break; } S = data; UI.phaseId = S.currentPhase; markDirty(); render(); toast('Backup restored'); }
      catch (er) { toast('That doesn’t look like a planner backup'); } break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, ch = el.getAttribute && el.getAttribute('data-ch'); if (!ch) return;
  var id = el.getAttribute('data-id');
  if (ch === 'phase') { UI.phaseId = el.value; UI.boardWeek = 'all'; render(); return; }
  if (ch === 'boardWeek' || ch === 'member' || ch === 'prMember') { UI[ch] = el.value; render(); return; }
  if (locked()) { toast(mode === 'connecting' ? 'Still loading the team’s data…' : 'View only'); render(); return; }
  if (ch === 't-pri') { task(id).priority = +el.value; }
  else if (ch === 't-status') { task(id).status = el.value; }
  else if (ch === 'g-status') { byId(S.goals, id).status = el.value; }
  else if (ch === 'm-color') { member(id).color = el.value; }
  else if (ch === 'm-name') { var m = member(id); m.name = el.value.trim() || m.name; m.short = m.name.split(' ')[0]; }
  else if (ch === 'm-role') { member(id).role = el.value.trim(); }
  else if (ch === 'cats') { S.categories = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); }
  markDirty(); render();
});
window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (VIEWS.indexOf(h) >= 0 && h !== UI.view) { UI.view = h; render(); } });
var rT; window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { if (UI.view === 'timeline' || UI.view === 'goals') render(); }, 200); });

render();
try { var sc = JSON.parse(sessionStorage.getItem('t16-scroll') || 'null'); if (sc) { window.scrollTo(0, sc.y || 0); sessionStorage.removeItem('t16-scroll'); } } catch (e) {}
})();
</script></body></html>
